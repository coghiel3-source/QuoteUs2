    <!-- ═══════════════════════════════════════════════════
         STRUCTURED DATA — Rent Guarantee FAQ (JSON-LD)
    ═══════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Rent Guarantee insurance for landlords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rent Guarantee insurance protects Canadian landlords from lost rental income if a tenant stops paying. It covers up to 12 months of unpaid rent (max $60,000), up to $1,500 in eviction costs, and up to $10,000 in property damage. It is available across Canada except Quebec."
          }
        },
        {
          "@type": "Question",
          "name": "Who qualifies for Rent Guarantee insurance in Canada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Landlords and property owners across Canada (excluding Quebec) qualify. Tenants must have a household rent-to-income ratio under 45%, no bankruptcy or evictions in the last 3 years, and at least one employed member. Government ID and proof of income are required."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Rent Guarantee insurance cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pricing depends on your monthly rental amount, location, and tenant profile. Submit your details on QuoteUs.ca and a licensed specialist will provide a tailored quote within 1 business day — at no cost or obligation."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get covered with Rent Guarantee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Once your application and tenant screening are complete, coverage can typically be activated within 1–3 business days."
          }
        },
        {
          "@type": "Question",
          "name": "What documents do I need to file a Rent Guarantee claim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To file a claim you will need: an executed lease agreement, tenant credit/screening report, proof of income, rent payment history, proof of property ownership, proof of renters insurance, and proof of property insurance. A move-in inspection with photos is required only for property damage claims."
          }
        }
      ]
    }
    </script>
